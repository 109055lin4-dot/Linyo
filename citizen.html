<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國民專屬數位護照頁面</title>
    <style>
        body { background: #0d1b2a; color: #fff; font-family: sans-serif; padding: 20px; }
        .passport-card { max-width: 500px; margin: 0 auto; background: #1b263b; border: 3px solid #e0a96d; border-radius: 15px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { text-align: center; border-bottom: 1px solid #415a77; padding-bottom: 10px; }
        .field { margin: 12px 0; }
        .field label { color: #e0a96d; font-size: 0.85rem; display: block; }
        .field div { font-size: 1.1rem; font-weight: bold; }
        .interactive-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-top: 15px; }
        button { background: #e0a96d; color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        textarea, input[type="color"] { width: 100%; padding: 8px; margin-top: 5px; background: #000; color: #fff; border: 1px solid #415a77; border-radius: 5px; }
    </style>
</head>
<body>

<div class="passport-card" id="cardContainer">
    <div class="header">
        <h2>🛂 宥成民國 數位國民護照</h2>
        <p style="font-size: 0.8rem; color: #aaa;">PASSPORT & DIGITAL IDENTITY</p>
    </div>

    <div class="field">
        <label>護照編號 (ID / PASSWORD)</label>
        <div id="dispId">-</div>
    </div>
    <div class="field">
        <label>持有人姓名 (OWNER)</label>
        <div id="dispOwner">-</div>
    </div>
    <div class="field">
        <label>身份等級 (LEVEL)</label>
        <div id="dispLevel">-</div>
    </div>
    <div class="field">
        <label>通關權限 (CLEARANCE)</label>
        <div id="dispClearance">-</div>
    </div>
    <div class="field">
        <label>個人宣告 / 簡介 (BIO)</label>
        <div id="dispBio" style="font-weight: normal; font-size: 0.95rem;">-</div>
    </div>

    <!-- 客製化與互動專區 -->
    <div class="interactive-box">
        <h3>🎨 頁面個人客製化</h3>
        <label style="font-size: 0.8rem;">修改主題邊框顏色：</label>
        <input type="color" id="colorPicker" onchange="updateTheme()">
        
        <label style="font-size: 0.8rem; margin-top: 10px; display:block;">更新個人簡介：</label>
        <textarea id="bioInput" rows="2" placeholder="輸入新的個人簡介..."></textarea>
        <button onclick="saveCustom()">儲存個人排版設定</button>
    </div>

    <div class="interactive-box">
        <h3>🪙 每日領津貼與簽章</h3>
        <p style="font-size: 0.85rem; color: #aaa;">每日 07:00 ~ 12:00 可領取 100 林幣津貼</p>
        <button onclick="claimAllowance()">領取每日 $100 LD 津貼</button>
        <p id="claimMsg" style="color: #2ebd59; font-size: 0.85rem; margin-top: 5px;"></p>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <button onclick="window.location.href='index.html'" style="background: #415a77; color: #fff;">返回大使館首頁</button>
    </div>
</div>

<script>
    let currentUser = null;

    window.onload = function() {
        const data = localStorage.getItem('currentUser');
        if (!data) {
            alert('請先從首頁登入！');
            window.location.href = 'index.html';
            return;
        }
        currentUser = JSON.parse(data);

        // 帶入個人數據
        document.getElementById('dispId').innerText = currentUser.id;
        document.getElementById('dispOwner').innerText = currentUser.owner;
        document.getElementById('dispLevel').innerText = currentUser.level;
        document.getElementById('dispClearance').innerText = currentUser.clearance;
        document.getElementById('dispBio').innerText = currentUser.customBio;
        document.getElementById('cardContainer').style.borderColor = currentUser.themeColor;
    };

    function updateTheme() {
        const color = document.getElementById('colorPicker').value;
        document.getElementById('cardContainer').style.borderColor = color;
        currentUser.themeColor = color;
    }

    function saveCustom() {
        const bio = document.getElementById('bioInput').value.trim();
        if (bio) {
            currentUser.customBio = bio;
            document.getElementById('dispBio').innerText = bio;
        }
        // 若為未註冊帳號，第一次修改時自動註冊名稱
        if (currentUser.owner.includes("未註冊")) {
            const name = prompt("請輸入您的國民真實姓名或綽號：");
            if (name) {
                currentUser.owner = name;
                currentUser.level = "認證國民";
                document.getElementById('dispOwner').innerText = name;
                document.getElementById('dispLevel').innerText = "認證國民";
            }
        }
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        alert('✨ 個人頁面排版與設定已成功儲存！');
    }

    function claimAllowance() {
        document.getElementById('claimMsg').innerText = "✅ 已成功領取每日 100 林幣津貼！(已登記至中央國庫備查)";
    }
</script>
</body>
</html>
